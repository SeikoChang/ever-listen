name: Flutter CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: cd flutter_voice_recorder && flutter pub get
      - run: cd flutter_voice_recorder && dart format --output=none --set-exit-if-changed lib test
      - run: cd flutter_voice_recorder && flutter analyze
      - run: cd flutter_voice_recorder && flutter test

  android-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: cd flutter_voice_recorder && flutter pub get
      - run: cd flutter_voice_recorder/android && ./gradlew test --no-daemon --console=plain

  ios-simulator-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: cd flutter_voice_recorder && flutter pub get
      - run: cd flutter_voice_recorder && flutter build ios --simulator --no-codesign
      - run: >-
          cd flutter_voice_recorder && xcodebuild test
          -project ios/Runner.xcodeproj
          -scheme Runner
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 15'
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO
