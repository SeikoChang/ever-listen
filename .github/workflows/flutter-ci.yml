name: Flutter CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: cd flutter_voice_recorder && flutter pub get
      - run: cd flutter_voice_recorder && dart format --output=none --set-exit-if-changed lib test
      - run: cd flutter_voice_recorder && flutter analyze
      - run: cd flutter_voice_recorder && flutter test

  android-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: cd flutter_voice_recorder && flutter pub get
      - run: cd flutter_voice_recorder/android && ./gradlew test --no-daemon --console=plain
