name: Flutter CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - run: cd flutter_voice_recorder && flutter pub get
      - run: cd flutter_voice_recorder && dart format --output=none --set-exit-if-changed lib test
      - run: cd flutter_voice_recorder && flutter analyze
      - run: cd flutter_voice_recorder && flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: ever-listen-flutter-coverage
          path: flutter_voice_recorder/coverage/lcov.info
          if-no-files-found: error

  android-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - run: cd flutter_voice_recorder && flutter pub get
      - run: cd flutter_voice_recorder/android && ./gradlew test --no-daemon --console=plain
      - run: cd flutter_voice_recorder && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ever-listen-android-debug-apk
          path: flutter_voice_recorder/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - run: cd flutter_voice_recorder && flutter build appbundle --release

  ios-simulator-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - run: cd flutter_voice_recorder && flutter pub get
      - run: cd flutter_voice_recorder && flutter build ios --simulator --no-codesign
      - run: >-
          cd flutter_voice_recorder && xcodebuild test
          -project ios/Runner.xcodeproj
          -scheme Runner
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 15'
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO
